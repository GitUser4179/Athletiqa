# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - athletiqa-api

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/main_athletiqa-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build backend/backend.csproj --configuration Release

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.8

      - name: Build migration bundle
        run: dotnet ef migrations bundle --project backend/backend.csproj --startup-project backend/backend.csproj --configuration Release --self-contained -r linux-x64 --output "${{ runner.temp }}/efbundle"

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: ef-migrations
          path: ${{ runner.temp }}/efbundle

      - name: dotnet publish
        run: dotnet publish backend/backend.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Download migration bundle
        uses: actions/download-artifact@v4
        with:
          name: ef-migrations
          path: ${{ runner.temp }}/migrations

      - name: Apply EF migrations
        env:
          SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "::error::Repository secret AZURE_SQL_CONNECTION_STRING is missing or empty (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
          chmod +x "${{ runner.temp }}/migrations/efbundle"
          "${{ runner.temp }}/migrations/efbundle" --connection "$SQL_CONNECTION"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0497F3B6484B497B90B39C20AD9333DF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCF5020E6F02489A87431B200BF6669D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_17367E793DEE4EEEA2278EE4302BE61A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'athletiqa-api'
          slot-name: 'Production'
          package: .
